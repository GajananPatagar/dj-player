name: Build DJ Play and Commentry App APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Safely Generate Android Folder Without Touching lib/
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.gajanan.djplaycommentry --project-name dj_player /tmp/shell
            cp -r /tmp/shell/android ./android
          fi
          grep -n "void main()" lib/main.dart

      - name: Inject HD Neural Voice Selector & Real MediaRecorder Into MainActivity.kt
        run: |
          MAIN_KT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_KT" ]; then
            PKG_LINE=$(head -n 1 "$MAIN_KT")
            cat << 'KTEOF' > "$MAIN_KT"
          $PKG_LINE
          import android.media.MediaRecorder
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.speech.tts.Voice
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.util.Locale

          class MainActivity: FlutterActivity(), TextToSpeech.OnInitListener {
              private var tts: TextToSpeech? = null
              private var ttsReady: Boolean = false
              private var recorder: MediaRecorder? = null
              private var currentRecordPath: String? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  tts = TextToSpeech(this, this)
              }

              override fun onInit(status: Int) {
                  ttsReady = (status == TextToSpeech.SUCCESS)
              }

              private fun selectBestNaturalVoice(locale: Locale) {
                  try {
                      val voices = tts?.voices ?: return
                      var bestVoice: Voice? = null
                      for (v in voices) {
                          if (v.locale.language == locale.language) {
                              if (bestVoice == null || v.quality > bestVoice.quality || v.name.contains("network", true) || v.name.contains("wavenet", true)) {
                                  bestVoice = v
                              }
                          }
                      }
                      if (bestVoice != null) {
                          tts?.voice = bestVoice
                      } else {
                          tts?.language = locale
                      }
                  } catch (_: Exception) {
                      tts?.language = locale
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "dj_native_tts").setMethodCallHandler { call, result ->
                      when (call.method) {
                          "speak" -> {
                              if (!ttsReady || tts == null) {
                                  result.success(false)
                                  return@setMethodCallHandler
                              }
                              val text = call.argument<String>("text") ?: ""
                              val lang = call.argument<String>("lang") ?: "kn-IN"
                              val pitch = (call.argument<Double>("pitch") ?: 1.0).toFloat()
                              val rate = (call.argument<Double>("rate") ?: 0.98).toFloat()
                              val locale = Locale.forLanguageTag(lang)
                              val avail = tts?.isLanguageAvailable(locale) ?: TextToSpeech.LANG_NOT_SUPPORTED
                              if (avail < TextToSpeech.LANG_AVAILABLE) {
                                  result.success(false)
                                  return@setMethodCallHandler
                              }
                              tts?.stop()
                              selectBestNaturalVoice(locale)
                              tts?.setPitch(pitch)
                              tts?.setSpeechRate(rate)
                              val speakRes = tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "dj_single_utt")
                              result.success(speakRes == TextToSpeech.SUCCESS)
                          }
                          "stopSpeak" -> {
                              tts?.stop()
                              result.success(true)
                          }
                          "startRecord" -> {
                              try {
                                  recorder?.release()
                                  val name = call.argument<String>("name") ?: "voice_clip"
                                  val outFile = File(filesDir, "${name}.m4a")
                                  currentRecordPath = outFile.absolutePath
                                  recorder = MediaRecorder().apply {
                                      setAudioSource(MediaRecorder.AudioSource.MIC)
                                      setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                                      setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                                      setAudioEncodingBitRate(128000)
                                      setAudioSamplingRate(44100)
                                      setOutputFile(currentRecordPath)
                                      prepare()
                                      start()
                                  }
                                  result.success(currentRecordPath)
                              } catch (e: Exception) {
                                  result.success(null)
                              }
                          }
                          "stopRecord" -> {
                              try {
                                  recorder?.stop()
                                  recorder?.release()
                                  recorder = null
                                  result.success(currentRecordPath)
                              } catch (e: Exception) {
                                  recorder?.release()
                                  recorder = null
                                  result.success(currentRecordPath)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  recorder?.release()
                  super.onDestroy()
              }
          }
          KTEOF
            sed -i "s|\$PKG_LINE|$PKG_LINE|g" "$MAIN_KT"
          fi

      - name: Set App Name, Cleartext Traffic, Audio Permissions & High-Class Icon
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="DJ Play and Commentry App"/g' "$MANIFEST"
            if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            fi
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <application/' "$MANIFEST"
            fi
          fi
          if [ -f "assets/icon.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp -f assets/icon.png "$dir/ic_launcher.png" || true
                cp -f assets/icon.png "$dir/ic_launcher_round.png" || true
              fi
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Install Dependencies & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
