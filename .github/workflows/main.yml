name: Build DJ Play and Commentry App APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Safely Generate Android Folder Without Touching lib/
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.gajanan.djplaycommentry --project-name dj_player /tmp/shell
            cp -r /tmp/shell/android ./android
          fi
          grep -n "void main()" lib/main.dart

      - name: Inject Hardware Noise-Canceled Karaoke Recorder, Vocal-Cut EQ & HD TTS Into MainActivity.kt
        run: |
          MAIN_KT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_KT" ]; then
            PKG_LINE=$(head -n 1 "$MAIN_KT")
            cat << 'KTEOF' > "$MAIN_KT"
          $PKG_LINE
          import android.Manifest
          import android.content.pm.PackageManager
          import android.media.MediaRecorder
          import android.media.MediaScannerConnection
          import android.media.audiofx.Equalizer
          import android.media.audiofx.LoudnessEnhancer
          import android.media.audiofx.Virtualizer
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.speech.tts.TextToSpeech
          import android.speech.tts.Voice
          import android.view.KeyEvent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.util.Locale

          class MainActivity: FlutterActivity(), TextToSpeech.OnInitListener {
              private var tts: TextToSpeech? = null
              private var ttsReady: Boolean = false
              private var recorder: MediaRecorder? = null
              private var currentRecordPath: String? = null
              private var karaokeEq: Equalizer? = null
              private var methodChannel: MethodChannel? = null

              private var virtualizer: Virtualizer? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  tts = TextToSpeech(this, this)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.WRITE_EXTERNAL_STORAGE), 200)
                      }
                  }
              }

              override fun onInit(status: Int) {
                  ttsReady = (status == TextToSpeech.SUCCESS)
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_UP) {
                      methodChannel?.invokeMethod("onVolumeKey", "UP")
                  } else if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      methodChannel?.invokeMethod("onVolumeKey", "DOWN")
                  }
                  return super.onKeyDown(keyCode, event)
              }

              private fun selectBestNaturalVoice(locale: Locale) {
                  try {
                      val voices = tts?.voices ?: return
                      var bestVoice: Voice? = null
                      for (v in voices) {
                          if (v.locale.language == locale.language) {
                              if (bestVoice == null || v.quality > bestVoice.quality || v.name.contains("network", true) || v.name.contains("wavenet", true)) {
                                  bestVoice = v
                              }
                          }
                      }
                      if (bestVoice != null) {
                          tts?.voice = bestVoice
                      } else {
                          tts?.language = locale
                      }
                  } catch (_: Exception) {
                      tts?.language = locale
                  }
              }

              private var loudnessEnhancer: LoudnessEnhancer? = null

              private fun applyKaraokeVocalCutEq(enabled: Boolean) {
                  // Pure untouched native media sound (No EQ distortion)
              }

              private fun startIsolatedVoiceRecorder(fileName: String, useEchoCancelledSource: Boolean): String? {
                  try {
                      recorder?.release()
                      val outFile = File(filesDir, fileName + ".m4a")
                      currentRecordPath = outFile.absolutePath
                      recorder = MediaRecorder().apply {
                          // VOICE_COMMUNICATION activates Android Hardware AcousticEchoCanceler & NoiseSuppressor
                          // so playing Karaoke backing music is subtracted from the mic and ONLY user singing is recorded!
                          if (useEchoCancelledSource) {
                              setAudioSource(MediaRecorder.AudioSource.VOICE_COMMUNICATION)
                          } else {
                              setAudioSource(MediaRecorder.AudioSource.MIC)
                          }
                          setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                          setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                          setAudioEncodingBitRate(192000)
                          setAudioSamplingRate(44100)
                          setOutputFile(currentRecordPath)
                          prepare()
                          start()
                      }
                      return currentRecordPath
                  } catch (_: Exception) {
                      return try {
                          recorder?.release()
                          val outFile = File(filesDir, fileName + ".m4a")
                          currentRecordPath = outFile.absolutePath
                          recorder = MediaRecorder().apply {
                              setAudioSource(MediaRecorder.AudioSource.MIC)
                              setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                              setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                              setAudioEncodingBitRate(192000)
                              setAudioSamplingRate(44100)
                              setOutputFile(currentRecordPath)
                              prepare()
                              start()
                          }
                          currentRecordPath
                      } catch (_: Exception) {
                          null
                      }
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val ch = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "dj_native_tts")
                  methodChannel = ch
                  ch.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "speak" -> {
                              if (!ttsReady || tts == null) {
                                  result.success(false)
                                  return@setMethodCallHandler
                              }
                              val text = call.argument<String>("text") ?: ""
                              val lang = call.argument<String>("lang") ?: "kn-IN"
                              val basePitch = (call.argument<Double>("pitch") ?: 1.0).toFloat()
                              val baseRate = (call.argument<Double>("rate") ?: 1.0).toFloat()
                              val locale = Locale.forLanguageTag(lang)
                              val avail = tts?.isLanguageAvailable(locale) ?: TextToSpeech.LANG_NOT_SUPPORTED
                              if (avail < TextToSpeech.LANG_AVAILABLE) {
                                  result.success(false)
                                  return@setMethodCallHandler
                              }
                              tts?.stop()
                              selectBestNaturalVoice(locale)

                              // Split into Lead Exclamation + Follow-up with a 90ms real human breath pause
                              // so the voice modulates pitch & speed naturally like a real stadium commentator!
                              val parts = text.split(" | ")
                              if (parts.size >= 2) {
                                  tts?.setPitch((basePitch * 1.06f).coerceIn(0.8f, 1.35f))
                                  tts?.setSpeechRate((baseRate * 1.08f).coerceIn(0.85f, 1.35f))
                                  tts?.speak(parts[0], TextToSpeech.QUEUE_FLUSH, null, "utt_hook")
                                  tts?.playSilentUtterance(90, TextToSpeech.QUEUE_ADD, "utt_breath")
                                  tts?.setPitch((basePitch * 0.97f).coerceIn(0.8f, 1.25f))
                                  tts?.setSpeechRate((baseRate * 1.01f).coerceIn(0.85f, 1.25f))
                                  val speakRes = tts?.speak(parts.subList(1, parts.size).joinToString(" "), TextToSpeech.QUEUE_ADD, null, "utt_body")
                                  result.success(speakRes == TextToSpeech.SUCCESS)
                              } else {
                                  tts?.setPitch(basePitch)
                                  tts?.setSpeechRate(baseRate)
                                  val speakRes = tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "dj_single_utt")
                                  result.success(speakRes == TextToSpeech.SUCCESS)
                              }
                          }
                          "stopSpeak" -> {
                              tts?.stop()
                              result.success(true)
                          }
                          "setKaraokeVocalCut" -> {
                              val enabled = call.argument<Boolean>("enabled") ?: false
                              applyKaraokeVocalCutEq(enabled)
                              result.success(true)
                          }
                          "startCleanVocalRecord" -> {
                              val name = call.argument<String>("name") ?: "karaoke_vocal"
                              val path = startIsolatedVoiceRecorder(name, true)
                              result.success(path)
                          }
                          "stopCleanVocalRecord" -> {
                              try {
                                  recorder?.stop()
                              } catch (_: Exception) {}
                              recorder?.release()
                              recorder = null
                              try {
                                  val src = currentRecordPath?.let { File(it) }
                                  if (src != null && src.exists() && src.length() > 500) {
                                      val dlDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                                      dlDir.mkdirs()
                                      val publicFile = File(dlDir, "DJ_Karaoke_" + src.name)
                                      src.copyTo(publicFile, overwrite = true)
                                      MediaScannerConnection.scanFile(this, arrayOf(publicFile.absolutePath), arrayOf("audio/mp4"), null)
                                  }
                              } catch (_: Exception) {}
                              result.success(currentRecordPath)
                          }
                          "startRecord" -> {
                              val name = call.argument<String>("name") ?: "voice_clip"
                              val path = startIsolatedVoiceRecorder(name, false)
                              result.success(path)
                          }
                          "stopRecord" -> {
                              try {
                                  recorder?.stop()
                                  recorder?.release()
                                  recorder = null
                                  result.success(currentRecordPath)
                              } catch (_: Exception) {
                                  recorder?.release()
                                  recorder = null
                                  result.success(currentRecordPath)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  recorder?.release()
                  
                  super.onDestroy()
              }
          }
          KTEOF
            sed -i "s|\$PKG_LINE|$PKG_LINE|g" "$MAIN_KT"
          fi

      - name: Set App Name, Cleartext Traffic, Audio/DSP Permissions & High-Class Icon
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="DJ Play and Commentry App"/g' "$MANIFEST"
            if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            fi
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"\/>\n    <application/' "$MANIFEST"
            fi
          fi
          if [ -f "assets/icon.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp -f assets/icon.png "$dir/ic_launcher.png" || true
                cp -f assets/icon.png "$dir/ic_launcher_round.png" || true
              fi
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Install Dependencies & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
