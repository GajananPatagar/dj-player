name: Build DJ Play and Commentry App APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Shell if Missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.gajanan.djplaycommentry --project-name dj_player .
          fi

      - name: Set App Name to "DJ Play and Commentry App" & Permissions & High-Class Icon
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="DJ Play and Commentry App"/g' "$MANIFEST"
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <application/' "$MANIFEST"
            fi
          fi
          # Inject High-Class Icon into all Android mipmap folders
          if [ -f "assets/icon.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp -f assets/icon.png "$dir/ic_launcher.png" || true
                cp -f assets/icon.png "$dir/ic_launcher_round.png" || true
              fi
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Install Flutter Dependencies & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
